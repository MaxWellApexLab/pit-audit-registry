name: verify published numbers

# A registry that grades other people's data should be checkable itself.
# This re-runs the code committed alongside each report and compares what it
# prints to what the report claims. A failure means a published figure and its
# own shipped script have parted ways — which is exactly the kind of drift the
# registry exists to object to elsewhere.

on:
  push:
    branches: [main]
    paths:
      - 'audits/**'
      - 'methodology/**'
      - 'badge-data/**'
      - 'tools/**'
      - '.github/workflows/verify.yml'
  pull_request:
  schedule:
    - cron: "0 7 * * 1"      # Mondays, 07:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy pandas scipy polars pyarrow pit-release-gate

      - name: Re-verify every published number
        run: python tools/verify_published_numbers.py
